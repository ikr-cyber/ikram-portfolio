<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labs de Vulnérabilité</title>
<style>
  :root{
    --bg-deep: #1a0f1c;
    --bg-panel: #241322;
    --bg-card: #2c1628;
    --pink-hot: #ff2e88;
    --pink-neon: #ff6ec7;
    --pink-soft: #ffb3d9;
    --pink-dim: #7a2f56;
    --text-main: #f6e9f2;
    --text-dim: #c9a6bd;
    --line: rgba(255,110,199,0.18);
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    --display: 'Space Grotesk', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 80% -10%, #3a1330 0%, var(--bg-deep) 55%);
    color: var(--text-main);
    font-family: var(--display);
    min-height: 100vh;
    display:flex;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width: 280px;
    flex-shrink:0;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    position: sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom: 26px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background: linear-gradient(135deg, var(--pink-hot), var(--pink-neon));
    display:flex;align-items:center;justify-content:center;
    font-weight:700; color:#1a0f1c; font-family: var(--mono);
    box-shadow: 0 0 18px rgba(255,46,136,0.55);
  }
  .brand-text{ font-size:15px; font-weight:700; letter-spacing:0.3px;}
  .brand-text small{ display:block; font-weight:400; color:var(--text-dim); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;}

  .nav-group-label{
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color: var(--pink-dim); margin: 18px 6px 8px; font-family: var(--mono);
  }
  .nav-item{
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 10px; border-radius:10px; cursor:pointer;
    color: var(--text-dim); text-decoration:none;
    font-size: 13.5px; line-height:1.35;
    border: 1px solid transparent;
    transition: all .15s ease;
  }
  .nav-item .idx{
    font-family: var(--mono); font-size:11px; color: var(--pink-neon);
    min-width: 20px;
  }
  .nav-item:hover{ background: rgba(255,110,199,0.08); color: var(--text-main);}
  .nav-item.active{
    background: linear-gradient(90deg, rgba(255,46,136,0.16), transparent);
    border-left: 2px solid var(--pink-hot);
    color: var(--text-main);
    font-weight:600;
  }

  /* ---------- MAIN ---------- */
  main{ flex:1; padding: 0; max-width: 980px; }
  .hero{
    padding: 70px 56px 40px;
    border-bottom: 1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; top:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--pink-hot), transparent);
    animation: sweep 4.5s linear infinite;
  }
  @keyframes sweep{
    0%{ transform: translateX(-100%);} 100%{ transform: translateX(100%);}
  }
  .eyebrow{
    font-family: var(--mono); font-size:12px; color: var(--pink-neon);
    letter-spacing: 3px; text-transform:uppercase; margin-bottom:14px;
  }
  h1.title{
    font-size: 42px; margin: 0 0 16px; line-height:1.1;
    background: linear-gradient(120deg, var(--text-main), var(--pink-soft));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{ color: var(--text-dim); font-size:15.5px; max-width:560px; line-height:1.6;}
  .stat-row{ display:flex; gap:28px; margin-top:28px; flex-wrap:wrap;}
  .stat b{ display:block; font-family: var(--mono); font-size:26px; color: var(--pink-neon);}
  .stat span{ font-size:12px; color: var(--text-dim); text-transform:uppercase; letter-spacing:1px;}

  .lab-section{
    padding: 54px 56px;
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 20px;
  }
  .lab-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:6px;}
  .lab-num{
    font-family: var(--mono); color: var(--pink-hot); font-size:14px;
    border:1px solid var(--pink-dim); padding:2px 8px; border-radius:20px;
  }
  .lab-title{ font-size:26px; margin:0; }
  .lab-tools{ color:var(--text-dim); font-size:13px; margin: 6px 0 30px; font-family: var(--mono);}
  .lab-tools span{ color: var(--pink-soft);}

  .obj-list{ list-style:none; margin:0 0 34px; padding:0;}
  .obj-list li{
    padding: 10px 0 10px 26px; position:relative; color: var(--text-main); font-size:14.5px;
    border-bottom: 1px dashed rgba(255,110,199,0.12);
  }
  .obj-list li::before{
    content:"▸"; position:absolute; left:0; color: var(--pink-hot);
  }

  /* accordion steps */
  .step{
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    background: var(--bg-card);
    overflow:hidden;
  }
  .step summary{
    list-style:none; cursor:pointer; padding: 16px 18px;
    display:flex; align-items:center; gap:14px;
    font-weight:600; font-size:14.5px;
  }
  .step summary::-webkit-details-marker{ display:none; }
  .step summary .num{
    font-family: var(--mono); width:26px; height:26px; border-radius:50%;
    background: var(--pink-dim); color: var(--text-main);
    display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
  }
  .step[open] summary .num{ background: var(--pink-hot); box-shadow: 0 0 12px rgba(255,46,136,.7);}
  .step summary::after{
    content:"＋"; margin-left:auto; color: var(--pink-neon); font-family: var(--mono);
  }
  .step[open] summary::after{ content:"－"; }
  .step-body{ padding: 0 18px 18px 58px; color: var(--text-dim); font-size:14px; line-height:1.65;}
  .step-body p{ margin: 8px 0;}
  .step-body .note{
    margin-top:10px; padding:10px 12px; border-left:3px solid var(--pink-hot);
    background: rgba(255,46,136,0.07); border-radius: 0 8px 8px 0; font-size:13.3px;
  }

  code.term, pre.term{
    display:block; background:#12080f; border:1px solid var(--pink-dim);
    color: var(--pink-neon); font-family: var(--mono); font-size:13px;
    padding: 12px 14px; border-radius:8px; margin: 10px 0; overflow-x:auto;
    box-shadow: inset 0 0 20px rgba(255,46,136,0.06);
  }
  code.term::before{ content:"$ "; color: var(--pink-hot);}

  table.cmd-table{ width:100%; border-collapse: collapse; margin: 18px 0 8px; font-size:13.3px;}
  table.cmd-table th{
    text-align:left; color: var(--pink-neon); font-family: var(--mono); font-weight:600;
    padding: 8px 10px; border-bottom: 1px solid var(--pink-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
  }
  table.cmd-table td{
    padding: 10px; border-bottom: 1px solid var(--line); color: var(--text-dim); vertical-align:top;
  }
  table.cmd-table td:first-child{ font-family: var(--mono); color: var(--pink-soft); white-space:nowrap;}
  table.cmd-table tr:hover td{ background: rgba(255,110,199,0.05); }

  .conclusion-card{
    margin-top: 30px; padding: 22px 24px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(255,46,136,0.10), rgba(255,110,199,0.02));
    border: 1px solid var(--pink-dim);
  }
  .conclusion-card h4{ margin:0 0 12px; color: var(--pink-soft); font-size:14px; text-transform:uppercase; letter-spacing:1px; font-family: var(--mono);}
  .conclusion-card ul{ margin:0; padding-left:20px; color: var(--text-dim); font-size:14px; line-height:1.7;}
  .conclusion-card strong{ color: var(--text-main); }

  .crucial{
    margin-top:16px; font-size:13.5px; padding:12px 14px; border-radius:8px;
    background: rgba(255,178,217,0.08); border: 1px dashed var(--pink-neon); color: var(--pink-soft);
  }

  footer{
    padding: 40px 56px 60px; color: var(--text-dim); font-size:12.5px; text-align:center;
  }
  footer .warn{ color: var(--pink-neon); margin-top:8px;}

  @media (max-width: 860px){
    body{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; position:relative; }
    .hero, .lab-section{ padding: 36px 22px; }
    h1.title{ font-size: 30px; }
  }
</style>
</head>

const navList = document.getElementById('nav-list');
const labsContainer = document.getElementById('labs-container');

LABS.forEach((lab, i) => {
  const id = 'lab-' + (i+1);

  // nav item
  const a = document.createElement('a');
  a.className = 'nav-item';
  a.href = '#' + id;
  a.innerHTML = `<span class="idx">0${i+1}</span> ${lab.title}`;
  navList.appendChild(a);

  // section
  const sec = document.createElement('section');
  sec.className = 'lab-section';
  sec.id = id;

  let stepsHtml = lab.steps.map((s, si) => `
    <details class="step" ${si===0 ? 'open' : ''}>
      <summary><span class="num">${si+1}</span> ${s.t}</summary>
      <div class="step-body">
        <p>${s.body}</p>
        ${s.cmd ? `<code class="term">${s.cmd}</code>` : ''}
        ${s.note ? `<div class="note">${s.note}</div>` : ''}
      </div>
    </details>
  `).join('');

  let cmdTableHtml = lab.cmdTable ? `
    <table class="cmd-table">
      <thead><tr><th>Commande / Ressource</th><th>Description</th><th>À retenir</th></tr></thead>
      <tbody>
        ${lab.cmdTable.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
      </tbody>
    </table>` : '';

  let extraHtml = lab.extraSection ? `
    <div class="conclusion-card" style="margin-top:24px;">
      <h4>${lab.extraSection.title}</h4>
      ${lab.extraSection.blocks.map(b => `
        <p style="color:var(--text-main); font-weight:600; margin:14px 0 6px;">${b.h}</p>
        <ul>${b.items.map(it => `<li>${it}</li>`).join('')}</ul>
      `).join('')}
    </div>` : '';

  sec.innerHTML = `
    <div class="lab-head">
      <span class="lab-num">LAB ${i+1}</span>
      <h2 class="lab-title">${lab.title}</h2>
    </div>
    <div class="lab-tools">Outils : <span>${lab.tools}</span></div>
    <ul class="obj-list">${lab.objectifs.map(o => `<li>${o}</li>`).join('')}</ul>
    ${lab.contexte ? `<div class="crucial" style="margin-bottom:26px;">${lab.contexte}</div>` : ''}
    ${stepsHtml}
    ${cmdTableHtml}
    ${extraHtml}
    <div class="conclusion-card">
      <h4>Conclusions & informations essentielles</h4>
      <ul>${lab.conclusions.map(c => `<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="crucial">${lab.crucial}</div>
  `;
  labsContainer.appendChild(sec);
});

// active nav highlight on scroll
const navItems = Array.from(document.querySelectorAll('#sidebar .nav-item'));
const sections = ['hero', ...LABS.map((_, i) => 'lab-' + (i+1))].map(id => document.getElementById(id));
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(e.isIntersecting){
      navItems.forEach(n => n.classList.remove('active'));
      const match = navItems.find(n => n.getAttribute('href') === '#' + e.target.id);
      if(match) match.classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -50% 0px' });
sections.forEach(s => s && io.observe(s));
</script>
